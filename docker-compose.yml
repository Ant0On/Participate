services:
  postgresdb:
    image: postgres
    container_name: database
    environment:
      - PGUSER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - DATABASE_HOST=${DB_HOST}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "-d", "db_prod" ]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    volumes:
      - ~/apps/postgres:/var/lib/postgresql/data
    networks:
      - network
  participate-backend:
      build: ./backend
      container_name: backend
      environment:
        - PGUSER=${DB_USER}
        - POSTGRES_PASSWORD=${DB_PASSWORD}
        - POSTGRES_DB=${DB_NAME}
        - DATABASE_HOST=${DB_HOST}
        - DATABASE_PORT=${DB_PORT}
      volumes:
        - ./backend:/app
      ports:
        - "3000:3000"
      depends_on:
        - postgresdb
      networks:
        - network
  participate-frontend:
      build: ./frontend
      container_name: frontend
      ports:
        - "8080:8080"
      volumes:
        - ./frontend:/app
      depends_on:
        - participate-backend
      networks:
        - network
networks:
  network:
    driver: bridge