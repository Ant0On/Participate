version: '3.4'

services:
  postgresdb:
    image: postgres
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - DATABASE_HOST=${DB_HOST}
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "-d", "db_prod" ]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    volumes:
      - ~/apps/postgres:/var/lib/postgresql/data # to be checked with different OS
    networks:
      - network
  participate:
      container_name: participateApp
      environment:
        - POSTGRES_USER=${DB_USER}
        - POSTGRES_PASSWORD=${DB_PASSWORD}
        - POSTGRES_DB=${DB_NAME}
        - DATABASE_HOST=${DB_HOST}
        - DATABASE_PORT=${DB_PORT}
      tty: true
      volumes:
        - .:/app
      build: .
      ports:
        - "8080:8080"
      restart: on-failure
      depends_on:
        - postgresdb
      networks:
        - network

networks:
  network:
    driver: bridge