version: '3'

services:
  postgres:
    image: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=participate
    ports:
      - "8080:8080"
  participate:
      container_name: participateApp
      environment:
        - POSTGRES_USER=${DB_USER}
        - POSTGRES_PASSWORD=${DB_PASSWORD}
        - POSTGRES_DB=${DB_NAME}
        - DATABASE_HOST=${DB_HOST}
        - DATABASE_PORT=${DB_PORT}
      tty: true
      build: .
      ports:
        - "8000:8080"
      restart: on-failure
      depends_on:
        - postgres