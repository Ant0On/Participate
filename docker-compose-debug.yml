services:
  postgresdb:
    image: postgres:16
    container_name: database
    user: postgres
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - DATABASE_HOST=${DB_HOST}
      - PGDATA=/var/lib/postgresql/data/some_name/
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "-d", "db_prod" ]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    volumes:
      - ./database/data:/var/lib/postgresql/data
    networks:
      - backend
  backend:
    build:
      context: ./backend
      dockerfile: ./dockerfiles/debug/Dockerfile
    container_name: backend
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - DATABASE_HOST=${DB_HOST}
      - DATABASE_PORT=${DB_PORT}
    volumes:
      - ./backend:/app
      - ./images:/app/images
    ports:
      - "3000:3000"
      - "40000:40000"
    depends_on:
      - postgresdb
    networks:
      - backend
      - frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./images:/app/images
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - frontend
networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge